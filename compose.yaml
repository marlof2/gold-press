services:
  app:
    build:
      context: .
      target: app
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-9090}:80"
    environment:
      APP_NAME: "Gold Press"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://144.91.76.180:9090}"
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/data/database.sqlite
      SESSION_DRIVER: database
      SESSION_LIFETIME: "${SESSION_LIFETIME:-5256000}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - sqlite_data:/var/www/data
      - app_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  sqlite_data:
  app_storage:
