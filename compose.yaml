services:
  app:
    build:
      context: .
      target: app
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    environment:
      ADMIN_NAME: "${ADMIN_NAME:-Administrador}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@goldpress.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      APP_NAME: "Gold Press"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/data/database.sqlite
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      GRAFICA_NOME: "${GRAFICA_NOME:-Gold Press Gráfica}"
      GRAFICA_ENDERECO: "${GRAFICA_ENDERECO:-Endereço da gráfica}"
      GRAFICA_TELEFONE: "${GRAFICA_TELEFONE:-(11) 99999-9999}"
    volumes:
      - sqlite_data:/var/www/data
      - app_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  sqlite_data:
  app_storage:
